# wgaf-daemon configuration. See README.md for more info

# Change only to run more than one daemon at once.
bus_name = "org.wgaf.Daemon"

# trace, debug, info, warn, or error. --log-level overrides per-run.
log_level = "info"

# Only useful for testing against a stub extension.
extension_bus_name = "org.gnome.Shell.Extensions.Wgaf"

# What the virtual uinput device reports to the kernel.
input_device_name = "wgaf virtual input device"
