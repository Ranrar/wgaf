# wgaf-daemon configuration. See docs/configuration.md for more info

# Change only to run more than one daemon at once.
bus_name = "org.wgaf.Daemon"

# trace, debug, info, warn, or error. --log-level overrides per-run.
log_level = "info"

# Only useful for testing against a stub extension.
extension_bus_name = "org.gnome.Shell.Extensions.Wgaf"

# What the virtual uinput device reports to the kernel.
input_device_name = "wgaf virtual input device"

# How long to wait, in milliseconds, after creating the virtual input device
# before sending the first keystroke or click through it.
#
# The wait is needed because the desktop does not start listening to a brand
# new input device the instant it appears — and anything sent before it does
# is thrown away with no error. Without this, the very first command after
# the daemon starts would quietly do nothing.
#
# You only pay this once, on the first command after the daemon starts, not
# on every command. Raise it if that first command still gets lost on a slow
# or busy machine.
input_device_settle_ms = 300

# A safety net for runaway scripts, in keystrokes and clicks per second.
# Going over it slows commands down rather than failing them, so a long
# automation still finishes. Raise it if legitimate work feels throttled;
# set it to 0 to turn the limit off.
input_max_events_per_second = 3000

# The most characters one `wgaf type` command may send. Anything longer is
# refused outright, so an oversized paste fails instead of being typed into
# whatever window happens to be focused. Lower it if you want a tighter guard.
#
# Careful: 0 here means "nothing may be typed at all", NOT "no limit" — the
# opposite of the setting above. That is on purpose, so a mistaken 0 fails
# safe rather than removing the guard.
input_max_type_text_chars = 4096

# The keyboard layout `wgaf type` types against.
#
# "auto" uses the layout your desktop is already set to, which is what you
# want unless you have a reason otherwise.
#
# To pick one yourself, write a layout code ("dk", "de", "fr"), a code with a
# variant ("dk(nodeadkeys)", "us(dvorak)"), or the full name your system uses
# for it ("Danish", "English (Dvorak)"). Run
# `localectl list-x11-keymap-layouts` to see the codes, and
# `localectl list-x11-keymap-variants dk` for one layout's variants.
#
# This is a keyboard layout, not a language. "en" is not a layout: English has
# ten of them, and US and Dvorak keyboards put nearly every key somewhere
# different.
#
# "us-ascii" is also accepted, and ignores your layout entirely in favour of a
# plain US keyboard. Only useful for scripts written around key positions
# rather than the characters they produce.
#
# The layout is read once when the daemon starts. If you change your keyboard
# layout afterwards, restart the daemon so it picks the new one up:
# `systemctl --user restart wgaf-daemon.service`
input_keyboard_layout = "auto"
