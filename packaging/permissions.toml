# wgaf-daemon permission policy. See docs/configuration.md for more info

[capabilities]

# Window management
FocusWindow = "Allow"
MoveWindow = "Allow"
ResizeWindow = "Allow"
CloseWindow = "Allow"

# Input synthesis
TypeText = "Allow"
KeyPress = "Allow"
KeyRelease = "Allow"
MouseMove = "Allow"
# Moving the pointer to an exact screen position, as `wgaf mouse move-to` does.
# Separate from MouseMove on purpose: that one nudges the pointer from wherever
# it happens to be, while this one can place it on a specific button and is what
# combines with MouseClick to press something chosen. Denying this still leaves
# relative movement working.
MouseMoveAbsolute = "Allow"
MouseClick = "Allow"
MouseScroll = "Allow"

# Accessibility actions
InvokeAction = "Allow"
SetText = "Allow"
FocusElement = "Allow"