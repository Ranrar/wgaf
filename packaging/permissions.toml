# wgaf-daemon permission policy. See docs/configuration.md for more info

[capabilities]

# Window management
FocusWindow = "Allow"
MoveWindow = "Allow"
ResizeWindow = "Allow"
CloseWindow = "Allow"

# Input synthesis
TypeText = "Allow"
KeyPress = "Allow"
KeyRelease = "Allow"
MouseMove = "Allow"
MouseClick = "Allow"
MouseScroll = "Allow"

# Accessibility actions
InvokeAction = "Allow"
SetText = "Allow"
FocusElement = "Allow"