# wgaf-daemon permission policy. See docs/configuration.md for more info

[capabilities]

# Window management
FocusWindow = "Allow"
MoveWindow = "Allow"
ResizeWindow = "Allow"
CloseWindow = "Allow"
# Watching windows open, close and take focus, as `wgaf window watch` does.
# Unlike the entries above it does not change anything — it is a live feed of
# every window that appears, including its title, for as long as the command
# runs. Denying it stops `wgaf window watch` and leaves `wgaf window list`
# working, so a one-off look at what is open is still available.
WatchWindows = "Allow"

# Workspaces
# Four entries rather than one, so that "let automation move around my desktop
# but not rearrange it" is something you can actually write: deny the three
# below and leave SwitchWorkspace allowed. Switching is the reversible one —
# you can always switch back — while adding, removing and reordering change the
# shape of the session, and removing moves whatever windows were on that
# workspace to a neighbouring one.
# Listing workspaces and reading their layout are never gated.
SwitchWorkspace = "Allow"
AddWorkspace = "Allow"
RemoveWorkspace = "Allow"
ReorderWorkspace = "Allow"
# Sending a window to another workspace. Grouped with the window entries above
# in spirit rather than with the three here: it changes neither how many
# workspaces there are nor which one you are on, it takes one of your windows
# out of sight. Allowing automation to navigate your desktop is not the same as
# letting it rearrange your windows behind you.
MoveWindowToWorkspace = "Allow"

# Window state
# One entry per state rather than one for all six, so that the ones which take
# over the screen can be denied on their own. Each covers both directions: a
# rule that let automation minimize a window but not restore it would only
# produce windows you cannot get back.
SetWindowMinimized = "Allow"
SetWindowMaximized = "Allow"
SetWindowFullscreen = "Allow"
# Keeping a window above every other one. It covers whatever you are looking at
# and stays there, which is a larger thing to agree to than a window changing
# size — deny this alone if that is the part you mind.
SetWindowAbove = "Allow"
SetWindowOnAllWorkspaces = "Allow"
# Raising a window to the top, or lowering it to the bottom. Not the same as
# FocusWindow: this changes what you can see, not where your keystrokes go.
RestackWindow = "Allow"

# Input synthesis
TypeText = "Allow"
KeyPress = "Allow"
KeyRelease = "Allow"
MouseMove = "Allow"
# Moving the pointer to an exact screen position, as `wgaf mouse move-to` does.
# Separate from MouseMove on purpose: that one nudges the pointer from wherever
# it happens to be, while this one can place it on a specific button and is what
# combines with MouseClick to press something chosen. Denying this still leaves
# relative movement working.
MouseMoveAbsolute = "Allow"
MouseClick = "Allow"
MouseScroll = "Allow"

# Accessibility actions
InvokeAction = "Allow"
SetText = "Allow"
FocusElement = "Allow"