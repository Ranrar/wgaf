[workspace]
resolver = "2"
members = ["wgaf-common", "wgaf-daemon", "wgaf-cli"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["Kim Skov Rasmussen"]
repository = "https://github.com/Ranrar/wgaf"

[workspace.dependencies]
wgaf-common = { path = "wgaf-common" }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
libc = "0.2"
# AT-SPI (Phase 5, accessibility automation). `tokio` feature is additive on
# top of the crate's own defaults (connection/proxies/p2p/wrappers) — see
# Documentation/phase5-accessibility-api.md §1 for why `zbus/async-io` still
# ends up compiled in transitively (atspi-connection/atspi-proxies pin it
# unconditionally) even though this workspace's own `zbus` dependency above
# only requests the `tokio` feature; this is harmless (unused reactor code),
# not a runtime conflict, confirmed by this phase's real-AT-SPI-bus tests.
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"] }
