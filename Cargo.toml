[workspace]
resolver = "2"
members = ["wgaf-common", "wgaf-daemon", "wgaf-cli"]
# The GTK4 test applications are a workspace of their own, so that `cargo build`
# and `cargo test` here need no GTK4 development packages. Build them with
# `make test-apps`. See tests/apps/README.md.
exclude = ["tests/apps"]

[workspace.package]
version = "0.8.5"
edition = "2024"
license = "MIT"
authors = ["Kim Skov Rasmussen"]
repository = "https://github.com/Ranrar/wgaf"

[workspace.dependencies]
wgaf-common = { path = "wgaf-common" }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
libc = "0.2"
# AT-SPI (accessibility automation). Default features are OFF; only the three
# features listed below are enabled. Even so, `zbus/async-io` still ends up
# compiled in transitively (atspi-connection/atspi-proxies pin it
# unconditionally on their own dependency edge) even though this workspace's
# own `zbus` dependency above only requests the `tokio` feature; this is
# harmless (unused reactor code), not a runtime conflict, confirmed by the
# real-AT-SPI-bus tests in wgaf-daemon/tests/accessibility.rs.
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"] }
# Only needed to call `.next()` on the `zbus` signal streams used to await
# the user's Allow/Deny choice from a `Prompt`-policy notification
# (`wgaf-daemon/src/permissions/notify.rs`). Not a new crate in the build
# graph — `futures-util` 0.3.33 is already resolved transitively via `zbus`/
# `atspi` (confirmed in `Cargo.lock`); this just makes it directly nameable.
# `default-features = false` + `std` only: no need for the `async-await`
# macro helpers or `alloc`-only mode.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Keyboard layout awareness (W12): reads the session's keymap and works out
# which key and modifiers produce a given character, so `wgaf type` is correct
# on layouts other than US-QWERTY.
#
# FFI bindings to the system `libxkbcommon`, from the repository
# `rust-x-bindings/xkbcommon-rs`. Note the crate published there is `xkbcommon`,
# while a *different* project publishes a pure-Rust crate called `xkbcommon-rs`
# — never name this dependency by one half alone.
#
# The C library is the point, not a compromise: the compositor resolves this
# same keymap with `libxkbcommon`, so using it means wgaf works out the same
# character the compositor will produce, rather than agreeing with it only as
# far as it has been tested.
#
# Needs `libxkbcommon-dev` to build. `x11` stays OFF (it is off by default) —
# this project takes no X11 dependencies.
xkbcommon = "0.9"
# Reading the session's keyboard keymap (W12). The daemon connects once at
# startup, takes the keymap the compositor hands every Wayland client, and
# closes the connection — it holds nothing and listens for nothing, because the
# layout is pinned at startup and deliberately not tracked afterwards.
#
# A native Wayland protocol rather than a GNOME one, so this works on any
# Wayland compositor and keeps `wgaf type` correct without the Shell extension.
wayland-client = "0.31"
# Shell completion script generation for `wgaf completions <shell>`
# (wgaf-cli/src/main.rs). Pinned to the 4.x line to track `clap` 4.
clap_complete = "4"
# Man page generation, exercised on demand via an `#[ignore]`d test
# (wgaf-cli/src/main.rs) rather than at every build — see that test's doc
# comment. `[dev-dependencies]`-only in wgaf-cli, so it never ships in the
# release binary.
clap_mangen = "0.3"
